# bounty-agent configuration
# Tune these without touching code.

[search]
# One GitHub search is issued per label. Labels are matched case-insensitively.
labels = [
  "💎 Bounty",
  "bounty",
  "💰 Reward",
  "cash-bounty",
]
# "paid" was dropped: Baserow uses it for premium features, others for
# bounties already paid out. It surfaced no real open bounty.
# Also search issues these accounts have commented on. Algora's bot posts the
# bounty as a comment and many funded repos never apply a label.
commenters = [
  "algora-pbc",          # Algora: Stripe Connect payouts
  "opirebot[bot]",       # Opire: tracks only, payment arranged person to person
  "bountyhub-app[bot]",  # BountyHub: Stripe Express, PayPal fallback, 0% solver fee
]
# boss-bounty[bot] is left out on purpose: boss.dev pays residents of 23
# countries only, and Thailand is not one of them.
# Extra raw GitHub search queries, run as-is.
# Expensify: every "Help Wanted" issue is a paid Upwork job (amount in the title).
queries = [
  'repo:Expensify/App is:issue is:open label:"Help Wanted"',
]
# Skip issues created before this many days ago (0 = no limit).
max_age_days = 1095
# Hard cap on issues pulled per label per cycle.
per_label_limit = 100

[filter]
# Drop issues already assigned to someone else.
drop_assigned = true
# Drop issues with at least this many linked pull requests.
# Fresh popular bounties attract dozens of agent PRs; those are unwinnable.
max_competitors = 12
# Drop issues whose parsed bounty is below this (USD). Unknown amounts are kept.
min_amount = 0
# Bounty farms: tiny repos posting hundreds of templated "bounties", or forks
# of a real project re-listing its issues. Paying out is rare. A fork count far
# above the star count means people clone to farm, not because they use it.
drop_forks = true
min_repo_stars = 10
max_fork_star_ratio = 6.0
# Repos above this star count draw heavy competition; scored down, not dropped.
crowded_repo_stars = 20000
# Issue farms: thousands of templated issues all carrying the same amount.
# They are not real bounties and they drown out everything else.
blocked_repos = [
  "SecureBananaLabs/bug-bounty",
  "Scottcjn/Rustchain",  # pays in its own token, not cash
  "Ikalus1988/MisakaNet",  # self-labelled "[Bounty][$0]" tasks, hundreds of comments
  "auscaster/frantic-board",  # $1-2 product-trial micro tasks
  "riteshbonthalakoti/HELPDESK.AI",  # no cash amount, forks > stars, 4000+ issues
  # .github/LLM_USAGE_POLICY.md: an LLM "MUST NOT author any part of a submission".
  "fluxerapp/fluxer",
  "fluxerapp/fluxer-meta",
]
# Comment-heavy issues are crowded even when nobody has linked a PR yet:
# claimants pile in with "/attempt" and answers posted as comments.
max_comments = 150
# Issues already screened and rejected: never alert on them again. Add "owner/repo#number".
blocked_issues = [
