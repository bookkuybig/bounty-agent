# Repos where an internal staffer is always assigned and bots comment a lot,
# so the assignee and comment-count filters say nothing about competition.
# Linked PRs still count: one means a contributor was already hired.
exempt_repos = ["Expensify/App"]
# Repos where people compete with written proposals in the comments before any
# PR exists. Each distinct proposal author counts as a rival, and these repos
# skip max_per_repo so every open job gets measured.
proposal_repos = ["Expensify/App"]
# Labels that mean someone already has the job (matched case-insensitively).
# Expensify: "Reviewing" = a PR is under review, "Awaiting Payment" = done.
drop_labels = ["Reviewing", "Awaiting Payment"]
# A single repo may contribute at most this many rows to the report, and gets
# at most this many timeline lookups per cycle. Keeps one noisy repo from
# eating the whole API budget.
max_per_repo = 3

[scoring]
# Issues untouched for this long suggest earlier attempts failed — opportunity.
stale_bonus_days = 45
stale_bonus = 1.4
# Multiplier applied when someone else is assigned.
assigned_penalty = 0.05
# Multiplier when the bounty amount could not be parsed.
unknown_amount_penalty = 0.6
# Fallback USD value used for ranking when no amount is parsed.
assumed_amount = 120

[effort]
# Crude hour estimates, used as the denominator of the score.
# No LLM involved at this stage — that is the point.
default_hours = 4.0
long_body_chars = 3000
long_body_hours = 8.0
label_hours = { "good first issue" = 1.5, "documentation" = 1.5, "docs" = 1.5, "typo" = 1.0, "bug" = 3.0, "enhancement" = 6.0, "feature" = 6.0, "performance" = 6.0, "compiler" = 10.0 }

[stack]
# Languages you actually want. Matched against the repo's primary language.
# Repos outside this list are scored down, not dropped. Empty list = no preference.
preferred = ["Python"]
# Multiplier for repos whose language is not in `preferred`.
off_stack_penalty = 0.5

[api]
# Timeline lookups cost one request each. Only the top N candidates per cycle
# get one, and results are cached until the issue's updated_at changes.
timeline_budget = 250

[notify]
# Windows toast when an issue passes the filters for the first time.
# Every alert is also appended to alerts.log.
toast = true
# Phone push via ntfy.sh: install the ntfy app and subscribe to this topic.
# Anyone who knows the name can read the alerts, so keep it random.
# Empty string disables it.
ntfy_topic = ""

[sources]
# Polled every cycle in addition to GitHub search. Pays in USDC, ETH, BTC or
# USD bank transfer; crypto is fine for us. Empty string disables it.
taskbounty_url = "https://www.task-bounty.com/api/v1/tasks"
# ML / data science competitions (Kaggle, Codabench, Zindi, CrunchDAO...).
# The page embeds all listings as JSON; only open ones at or above the prize floor alert.
mlcontests_url = "https://mlcontests.com/"
mlcontests_min_prize = 1000
