  "sybil-solutions/local-ai-registry#219",  # needs a GPU we do not own (we have RTX 5060 Ti 16GB only)
  "sybil-solutions/local-ai-registry#218",  # needs a GPU we do not own (we have RTX 5060 Ti 16GB only)
  "sybil-solutions/local-ai-registry#217",  # needs a GPU we do not own (we have RTX 5060 Ti 16GB only)
  "sybil-solutions/local-ai-registry#216",  # needs a GPU we do not own (we have RTX 5060 Ti 16GB only)
